backend:
  name: git-gateway
  branch: main

media_folder: "img/uploads"
public_folder: "/img/uploads"

locale: "it"

collections:
  - name: "media"
    label: "Le tue foto e i tuoi video"
    description: "Carica le foto delle serate e i link dei video: dopo il Pubblica saranno online"
    files:
      - name: "galleria"
        label: "Galleria del sito"
        file: "content/media.json"
        fields:
          - name: "foto"
            label: "Foto"
            widget: "list"
            summary: "Foto della galleria"
            fields:
              - name: "immagine"
                label: "Immagine"
                widget: "image"
              - name: "didascalia"
                label: "Didascalia (facoltativa)"
                widget: "string"
                required: false
          - name: "video"
            label: "Video"
            widget: "list"
            summary: "Video del sito"
            fields:
              - name: "url"
                label: "Link embed YouTube o Vimeo"
                widget: "string"
              - name: "titolo"
                label: "Titolo"
                widget: "string"
